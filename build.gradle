plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.2'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'org.graalvm.buildtools.native' version '0.11.4'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'Demo project for Spring Boot'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

graalvmNative {
	binaries {
		main {
			buildArgs.add('--initialize-at-build-time=org.h2.Driver')
			buildArgs.add('--initialize-at-build-time=org.postgresql.Driver')
			buildArgs.add('--initialize-at-build-time=org.postgresql.util.SharedTimer')
			buildArgs.add('--initialize-at-build-time=org.postgresql.jdbc.ResourceLock')
			buildArgs.add('-H:+ReportExceptionStackTraces')
			buildArgs.add('--enable-url-protocols=http,https')
			buildArgs.add('--verbose')
		}
	}
	metadataRepository {
		enabled = true
	}
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-h2console'
	implementation 'org.springframework.boot:spring-boot-starter-batch'
	implementation 'org.springframework.boot:spring-boot-starter-jdbc'
	implementation 'com.h2database:h2'
	implementation 'org.postgresql:postgresql'
	testImplementation 'org.springframework.boot:spring-boot-starter-batch-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}
